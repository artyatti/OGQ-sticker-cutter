<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGQ 스티커 자동 분할기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #03c75a;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .upload-btn-label {
            display: block;
            background-color: #03c75a;
            color: white;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .upload-btn-label:active {
            background-color: #02b350;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #2f3438;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #1a1d20;
        }
        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #e11d48;
            font-size: 14px;
        }
        .success {
            color: #03c75a;
        }
        #preview-container {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        .preview-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px;
            background: #fff;
            text-align: center;
        }
        .preview-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .preview-item span {
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OGQ 스티커 자동 분할기</h1>
    <p>프로크리에이트 4×6 통이미지(2960×3840)를 선택하면 24개로 자동 분할됩니다.</p>

    <label class="upload-btn-label">
        📁 통이미지 파일 선택하기
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div id="file-name" style="font-size: 13px; color: #666; margin-bottom: 15px;">선택된 파일 없음</div>

    <button class="btn" id="splitBtn" disabled>24장 자르고 다운로드하기</button>
    
    <div class="status" id="statusText">이미지를 선택해주세요.</div>
    <div id="preview-container"></div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const splitBtn = document.getElementById('splitBtn');
    const fileNameDisplay = document.getElementById('file-name');
    const statusText = document.getElementById('statusText');
    const previewContainer = document.getElementById('preview-container');

    let uploadedImage = null;

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        fileNameDisplay.innerHTML = `선택된 파일: <b>${file.name}</b>`;
        statusText.className = "status";
        statusText.textContent = "이미지 안정화 로딩 중...";

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                uploadedImage = img;
                splitBtn.disabled = false;
                statusText.className = "status success";
                statusText.textContent = `로드 완료! (${img.width}x${img.height})`;
            };
            img.onerror = function() {
                statusText.className = "status";
                statusText.textContent = "이미지 로드 실패 (파일 형식 확인)";
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    splitBtn.addEventListener('click', () => {
        if (!uploadedImage) return;

        previewContainer.innerHTML = '';
        statusText.className = "status success";
        statusText.textContent = '24조각으로 나누는 중...';

        const cols = 4;
        const rows = 6;
        const pieceWidth = uploadedImage.width / cols;
        const pieceHeight = uploadedImage.height / rows;

        let count = 0;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                count++;
                const canvas = document.createElement('canvas');
                canvas.width = Math.floor(pieceWidth);
                canvas.height = Math.floor(pieceHeight);
                const ctx = canvas.getContext('2d');

                ctx.drawImage(
                    uploadedImage, 
                    Math.floor(c * pieceWidth), Math.floor(r * pieceHeight), 
                    Math.floor(pieceWidth), Math.floor(pieceHeight), 
                    0, 0, 
                    canvas.width, canvas.height
                );

                const dataUrl = canvas.toDataURL('image/png');

                // 미리보기 생성
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';
                itemDiv.innerHTML = `<img src="${dataUrl}"><span>#${count}</span>`;
                previewContainer.appendChild(itemDiv);

                // 다운로드 트리거
                setTimeout((idx, url) => {
                    const link = document.createElement('a');
                    link.download = `sticker_${idx.toString().padStart(2, '0')}.png`;
                    link.href = url;
                    link.click();
                }, count * 200, count, dataUrl);
            }
        }

        statusText.textContent = '분할 완료! 다운로드 폴더를 확인하세요.';
    });
</script>

</body>
</html>
